name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vet libraries
        shell: bash
        run: |
          for dir in libs/*/; do
            (cd "$dir" && go vet ./...)
          done

      - name: Build
        run: go build -ldflags "-H windowsgui" -o bin/platty.exe ./cmd/platty

      - name: Build for ARM64
        shell: bash
        run: GOARCH=arm64 go build -ldflags "-H windowsgui" -o bin/platty-arm64.exe ./cmd/platty
