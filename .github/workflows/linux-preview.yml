name: Linux preview

on:
  push:
    tags: ["linux-preview-*"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Gio dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Version
        run: |
          echo "BUILD=${GITHUB_REF_NAME#linux-preview-}" >> "$GITHUB_ENV"
          echo "VERSION=0.1.1-dev.linux.${GITHUB_REF_NAME#linux-preview-}" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          name="platty-linux-preview-$BUILD-amd64"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X github.com/plattyssh/platty/internal/version.Version=$VERSION" -o "dist/$name/platty" ./cmd/platty
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Release notes
        run: |
          cat > dist/notes.md <<NOTES
          A test build of Platty for Linux, made from \`${GITHUB_SHA::7}\`. It is not a release: expect rough edges, and please report what you find in #2.

          ### Run it
          \`\`\`sh
          tar -xzf platty-linux-preview-$BUILD-amd64.tar.gz
          ./platty-linux-preview-$BUILD-amd64/platty
          \`\`\`

          It needs Wayland or X11 with OpenGL ES or Vulkan. On Debian and Ubuntu: \`sudo apt install libwayland-client0 libwayland-egl1 libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libegl1 libvulkan1\`.

          ### What should work
          - SSH sessions, SFTP, port forwarding, the vault and the rest of the app
          - Local terminals in a Unix pseudo terminal, with bash, zsh and fish (your \`\$SHELL\` first)
          - The vault key in the system keyring (GNOME Keyring, KWallet) when one is running

          ### Not yet
          - Without a system keyring the vault key is stored unprotected: set a master password in Settings › Security
          - Native window decorations, drag and drop with the file manager, fontconfig lookup
          - Packages (AppImage, Flatpak, .deb, .rpm) and automatic updates
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "Platty Linux preview $BUILD" --notes-file dist/notes.md --prerelease --latest=false
