name: Linux preview

on:
  push:
    tags: ["linux-preview-*"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Gio dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Version
        run: |
          echo "BUILD=${GITHUB_REF_NAME#linux-preview-}" >> "$GITHUB_ENV"
          echo "VERSION=0.1.1-dev.linux.${GITHUB_REF_NAME#linux-preview-}" >> "$GITHUB_ENV"

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X github.com/plattyssh/platty/internal/version.Version=$VERSION" -o build/platty ./cmd/platty

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          name="Platty-linux-preview-$BUILD-x86_64.AppImage"
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/share/doc/platty dist
          cp LICENSE THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/platty/
          LDAI_OUTPUT="dist/$name" ./linuxdeploy --appdir AppDir -e build/platty -d packaging/linux/platty.desktop -i packaging/linux/platty.png --output appimage
          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Release notes
        run: |
          cat > dist/notes.md <<NOTES
          A test build of Platty for Linux, made from \`${GITHUB_SHA::7}\`. It is not a release: expect rough edges, and please report what you find in #2.

          ### Run it
          \`\`\`sh
          chmod +x Platty-linux-preview-$BUILD-x86_64.AppImage
          ./Platty-linux-preview-$BUILD-x86_64.AppImage
          \`\`\`

          It needs Wayland or X11 with OpenGL ES or Vulkan, which every desktop already has. If your system has no FUSE, run it with \`--appimage-extract-and-run\`.

          ### What should work
          - SSH sessions, SFTP, port forwarding, the vault and the rest of the app
          - Local terminals in a Unix pseudo terminal, with bash, zsh and fish (your \`\$SHELL\` first)
          - The vault key in the system keyring (GNOME Keyring, KWallet) when one is running

          ### Not yet
          - Without a system keyring the vault key is stored unprotected: set a master password in Settings › Security
          - Native window decorations, drag and drop with the file manager, fontconfig lookup
          - Desktop integration, Flatpak, .deb and .rpm packages, and automatic updates
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.sha256 \
            --title "Platty Linux preview $BUILD" --notes-file dist/notes.md --prerelease --latest=false
