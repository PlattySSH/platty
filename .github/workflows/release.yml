name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION -Installer

      - name: Release notes
        shell: bash
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<NOTES

          ### Install
          - **platty-$VERSION-setup.exe** installs Platty for your user, without administrator rights.
          - **platty-$VERSION-windows-amd64.zip** is the portable version: unzip it and run `platty.exe`.

          Beta builds aren't code-signed yet. If SmartScreen stops the download or the first launch, choose *More info* and then *Run anyway*.
          NOTES

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/platty-*.zip dist/platty-*-setup.exe \
            --title "Platty $VERSION" --notes-file dist/notes.md --prerelease
